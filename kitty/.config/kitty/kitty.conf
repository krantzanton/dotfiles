# kitty config — reload with ctrl+shift+f5

# --- Font -------------------------------------------------------------------
font_family      Cascadia Code NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures cursor

# --- Look -------------------------------------------------------------------
include oxocarbon.conf

window_padding_width 6
hide_window_decorations no
confirm_os_window_close 1
background_opacity 1.0

cursor_shape block
cursor_blink_interval 0

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# --- Behaviour --------------------------------------------------------------
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 3.0
url_style curly
detect_urls yes

# Lets nvim/tmux receive things like ctrl+shift keys correctly
shell_integration enabled

# Start inside tmux: the first window attaches to session "main",
# extra windows get their own session (so they don't mirror each other).
shell sh -c 'if [ "$(tmux display -p -t main "#{session_attached}" 2>/dev/null)" -gt 0 ] 2>/dev/null; then exec tmux new-session; else exec tmux new-session -A -s main; fi'

# --- Kitty splits (tmux splits are usually nicer; these are a fallback) ------
enabled_layouts splits,stack

map ctrl+shift+enter  launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+z      toggle_layout stack

# Move between kitty splits (alt so ctrl+arrows still reach the shell/nvim)
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# --- Tabs -------------------------------------------------------------------
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5

# --- Font size --------------------------------------------------------------
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
