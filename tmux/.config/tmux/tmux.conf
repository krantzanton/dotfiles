# tmux config — reload with <prefix> r
# No plugin manager needed; everything here is built in.

# --- Prefix: Ctrl-a ---------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General ----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10        # snappy <Esc> in nvim
set -g focus-events on        # lets nvim reload files changed on disk
set -g set-clipboard on
set -g allow-passthrough on   # images / OSC sequences inside nvim
set -g extended-keys on
set -g display-time 2000
set -g set-titles on
set -g set-titles-string "#S / #W"

# Windows and panes start at 1, renumber after closing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Splits & windows (open in current dir) ---------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-p previous-window
bind -r C-n next-window
bind Tab last-window
bind S choose-session
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Alt+number jumps to a window without the prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# --- Seamless Ctrl-h/j/k/l between tmux panes and nvim splits ----------------
# Pairs with christoomey/vim-tmux-navigator in nvim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Ctrl-l is taken above, so <prefix> C-l clears the screen
bind C-l send-keys C-l

# --- AI agents ----------------------------------------------------------------
# <prefix> a  Claude in a split on the right, same folder
# <prefix> A  Claude in its own window
# <prefix> g  lazygit pop-up (review what the agent changed; q closes it)
bind a split-window -h -l 40% -c "#{pane_current_path}" claude
bind A new-window -n claude -c "#{pane_current_path}" claude
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Windows with an agent waiting for you get a pink ● (set by ~/.claude/hooks/agent-status.sh).
# A terminal bell in a background window also highlights it.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# --- Copy mode (vi keys, copies to the Wayland clipboard) --------------------
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# --- Look (oxocarbon) -------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#161616,fg=#dde1e6"
set -g status-left-length 30
set -g status-left "#[bg=#78a9ff,fg=#161616,bold] #S #[bg=#161616] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#ee5396 bold]PREFIX ,}#[fg=#525252]%a %d %b #[fg=#dde1e6]%H:%M "

setw -g window-status-format "#[fg=#6f6f6f] #I:#W#{?window_zoomed_flag, 󰊓,}#{?@agent_waiting,#[fg=#ee5396] ●,} "
setw -g window-status-current-format "#[bg=#262626,fg=#33b1ff,bold] #I:#W#{?window_zoomed_flag, 󰊓,}#{?@agent_waiting,#[fg=#ee5396] ●,} "
setw -g window-status-separator ""
setw -g window-status-bell-style "fg=#ee5396,bold"

set -g pane-border-style "fg=#393939"
set -g pane-active-border-style "fg=#78a9ff"
set -g message-style "bg=#262626,fg=#f2f4f8"
set -g mode-style "bg=#393939,fg=#f2f4f8"
set -g display-panes-active-colour "#78a9ff"
set -g display-panes-colour "#525252"
